<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento | Eduardo Churrasqueiro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pagina-agendamento">

<nav>
    <div class="logo">EDUARDO CHURRASQUEIRO</div>
    <ul>
        <li><a href="agenda.html">Voltar à agenda</a></li>
    </ul>
</nav>

<section class="agendamento-container">
    <div class="agendamento-card">
        <h1>Realizar Agendamento</h1>
        <p>Preencha os dados abaixo para gerar a mensagem do WhatsApp.</p>

        <form id="formAgendamento">
            <label>Nome completo</label>
            <input type="text" id="nome" required>

            <label>CPF</label>
            <input type="text" id="cpf" maxlength="14" placeholder="000.000.000-00" required>

            <label>Data do evento</label>
            <input type="date" id="data" required>

            <label>Quantidade de pessoas</label>
            <input type="number" id="pessoas" min="1" required>

            <label>Endereço do evento</label>
            <textarea id="endereco" rows="4" required></textarea>

            <button type="submit" class="btn-form">Gerar mensagem no WhatsApp</button>
        </form>

        <div id="mensagemSucesso" class="mensagem-sucesso"></div>
    </div>
</section>

<script>
    const form = document.getElementById("formAgendamento");
    const cpf = document.getElementById("cpf");
    const mensagem = document.getElementById("mensagemSucesso");
    const inputData = document.getElementById("data");

    const parametros = new URLSearchParams(window.location.search);
    const dataSelecionada = parametros.get("data");
    if (dataSelecionada) inputData.value = dataSelecionada;

    cpf.addEventListener("input", function () {
        let valor = cpf.value.replace(/\D/g, "");
        valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
        valor = valor.replace(/(\d{3})(\d)/, "$1.$2");
        valor = valor.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        cpf.value = valor;
    });

    form.addEventListener("submit", function (e) {
        e.preventDefault();

        const nome = document.getElementById("nome").value;
        const cpfCliente = document.getElementById("cpf").value;
        const data = document.getElementById("data").value;
        const pessoas = document.getElementById("pessoas").value;
        const endereco = document.getElementById("endereco").value;
        const telefoneWhatsApp = "5511911478737";

        const texto = `*Novo agendamento*\n\n*Nome completo:* ${nome}\n*CPF:* ${cpfCliente}\n*Data do evento:* ${data}\n*Quantidade de pessoas:* ${pessoas}\n*Endereço:* ${endereco}`;
        const linkWhatsApp = `https://wa.me/${telefoneWhatsApp}?text=${encodeURIComponent(texto)}`;

        mensagem.innerHTML = `
            <h3>Agendamento preenchido com sucesso!</h3>
            <p>Clique abaixo para enviar os dados pelo WhatsApp.</p>
            <a href="${linkWhatsApp}" target="_blank" class="btn-form whatsapp-enviar">Enviar agendamento pelo WhatsApp</a>
        `;
    });
</script>

</body>
</html>
